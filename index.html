function lag(){const g=G["統一"]||[];for(const r of g.slice(0,6))for(const x of r){const m=/更新[:：]?\s*(\d{1,2}):(\d{2}):(\d{2})/.exec(x||"");if(m){const n=new Date(),t=n.getHours()*60+n.getMinutes()-(+m[1]*60+ +m[2]);return{t:m[1]+":"+m[2]+":"+m[3],d:((t%1440)+1440)%1440}}}return null}
function report(mode,n){const L=lag(),now=new Date().toLocaleTimeString("zh-TW",{hour12:false});
 $("src").innerHTML=`${mode}（${n} 頁）　抓取 ${now}`+(L?`　試算表資料時間 ${L.t}<b style="color:${L.d>15?"var(--er)":"inherit"}">（落後約 ${L.d} 分鐘）</b>`:"")}
async function refresh(){const b=baseUrl(),c=cfgGet();
 const sid=SID_Q||c.sid;
 if(sid){const ok=[];await Promise.all(NAMES.map(async n=>{try{const r=await fetch(`https://docs.google.com/spreadsheets/d/${sid}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(n)}&_t=${Date.now()}`);if(!r.ok)throw 0;const t=await r.text();if(t.trim().startsWith("<"))throw 0;G[n]=parseCSV(t);live[n]=1;ok.push(n)}catch(e){}}));
  if(ok.length===NAMES.length){report("即時・低延遲",ok.length);setSt("已更新 "+ok.length+" 頁");view();return}
  setSt("低延遲模式失敗（請確認共用設為「知道連結的任何人可檢視」），改用發佈網址",1)}
 try{const r=await fetch(`${b}?output=xlsx&_t=${Date.now()}`);if(!r.ok)throw 0;
  const wb=XLSX.read(await r.arrayBuffer(),{type:"array"});
  const vis=wb.SheetNames.filter((n,i)=>!((wb.Workbook&&wb.Workbook.Sheets&&wb.Workbook.Sheets[i]||{}).Hidden));
  G={};live={};vis.forEach(n=>{G[n]=XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:false,defval:""});live[n]=1});
  NAMES=vis;if(cur!=="總覽"&&!vis.includes(cur))cur="總覽";
  report("即時・整份 XLSX",vis.length);
  setSt("已更新 "+vis.length+" 頁");view();return}catch(e){}
 const jobs=NAMES.filter(n=>c.gids&&c.gids[n]),bad=[];
 if(!jobs.length){$("src").textContent="目前顯示：內建快照（整份 XLSX 讀取失敗）";setSt("整份讀取失敗，請在上方填入各工作頁 gid 改用逐頁讀取",1);view();return}
 await Promise.all(jobs.map(async n=>{try{const r=await fetch(`${b}?gid=${c.gids[n]}&single=true&output=csv&_t=${Date.now()}`);
  if(!r.ok)throw 0;G[n]=parseCSV(await r.text());live[n]=1}catch(e){bad.push(n)}}));
 $("src").textContent=`即時 ${Object.keys(live).length}/${NAMES.length} 頁（逐頁 CSV）　最後更新 ${new Date().toLocaleTimeString("zh-TW",{hour12:false})}`;
 setSt(bad.length?"讀取失敗："+bad.join("、"):"已更新 "+jobs.length+" 頁",bad.length);view()}
function sched(){clearInterval(timer);const n=+$("iv").value;if(n>0)timer=setInterval(refresh,n*1000)}
$("gids").innerHTML=NAMES.map(n=>`<label>${n} gid<input data-g="${n}"></label>`).join("");
const c0=cfgGet();$("base").value=c0.base||"";$("sid").value=c0.sid||"";$("iv").value=c0.iv||"60";
document.querySelectorAll("[data-g]").forEach(i=>i.value=(c0.gids||{})[i.dataset.g]||"");
$("sv").onclick=()=>{const gids={};document.querySelectorAll("[data-g]").forEach(i=>{if(i.value.trim())gids[i.dataset.g]=i.value.trim()});
 cfgSet({sid:$("sid").value.trim(),base:$("base").value.trim(),iv:$("iv").value,gids});live={};G={...SNAP};sched();refresh()};
$("rf").onclick=refresh;$("iv").onchange=sched;
$("tabs").onclick=e=>{const n=e.target.dataset.n;if(n){cur=n;history.replaceState(null,"","#"+encodeURIComponent(n));view()}};
$("shr").onclick=async()=>{const sd=cfgGet().sid||SID_Q,u=location.origin+location.pathname+"?only="+encodeURIComponent(cur)+(sd?"&s="+encodeURIComponent(sd):"");
 try{await navigator.clipboard.writeText(u);$("shr").textContent="已複製 ✓"}catch(e){prompt("複製此連結：",u)}
 setTimeout(()=>$("shr").textContent="複製此頁分享連結",1500)};
if(ONLY){$("tabs").style.display="none";document.querySelector("details").parentElement.style.display="none";$("shr").style.display="none";
 document.querySelector("h1").textContent="CoastFIRE・"+cur;document.title="CoastFIRE・"+cur}
document.addEventListener("visibilitychange",()=>{if(!document.hidden)refresh()});
$("src").textContent="目前顯示：內建快照（尚未設定連線）";view();sched();refresh();
</script></body></html>
